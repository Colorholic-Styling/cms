name: Sync from upstream

# Keeps forks of this repo up to date without losing their own commits.
#
# GitHub's native "Sync fork" only fast-forwards, so it stops working as soon as
# a fork carries local changes (e.g. its own wrangler.toml IDs). Instead this
# mirrors the parent's default branch into an `upstream-main` branch and keeps a
# single PR open against the fork's default branch — conflicts show up in the PR
# UI and can be resolved there.
#
# The job resolves its parent at runtime, so the file works unchanged in every
# fork in the chain and self-skips in the root repo, which has no parent.

on:
  schedule:
    - cron: '17 4 * * *' # daily, 04:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve parent repository
        id: parent
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          read -r url branch name base <<<"$(gh api "repos/${{ github.repository }}" \
            --jq '[.parent.clone_url // "", .parent.default_branch // "",
                   .parent.full_name // "", .default_branch] | @tsv')"
          if [ -z "$url" ]; then
            echo "No parent repository — this is the root repo, nothing to sync."
            exit 0
          fi
          echo "Parent: $name ($url, $branch) -> local $base"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "base=$base" >> "$GITHUB_OUTPUT"

      - name: Mirror upstream into `upstream-main`
        if: steps.parent.outputs.url != ''
        run: |
          set -euo pipefail
          git remote add upstream "${{ steps.parent.outputs.url }}"
          git fetch upstream "${{ steps.parent.outputs.branch }}"
          git push --force origin \
            "refs/remotes/upstream/${{ steps.parent.outputs.branch }}:refs/heads/upstream-main"

      - name: Open or refresh the sync PR
        if: steps.parent.outputs.url != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE: ${{ steps.parent.outputs.base }}
        run: |
          set -euo pipefail
          upstream_ref="refs/remotes/upstream/${{ steps.parent.outputs.branch }}"

          if git merge-base --is-ancestor "$upstream_ref" "origin/$BASE"; then
            echo "$BASE already contains upstream — nothing to do."
            exit 0
          fi

          open_pr=$(gh pr list --head upstream-main --base "$BASE" --state open \
            --json number --jq '.[].number')
          if [ -n "$open_pr" ]; then
            echo "PR #$open_pr is already open; the force-push above refreshed it."
            exit 0
          fi

          gh pr create --base "$BASE" --head upstream-main \
            --title "Sync from ${{ steps.parent.outputs.name }}" \
            --body "Automated upstream sync.

          Merge (do not rebase or squash) — rebasing rewrites the merge base and makes
          every later sync re-conflict.

          On conflict in \`wrangler.toml\`, keep this fork's own database and OAuth IDs."
